<!DOCTYPE html>
<html lang="en" data-theme="light">
<!-- Nothing Space Mockup Editor App -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>N-Mockup — Nothing Phone Mockup Editor</title>
    <meta name="description" content="Create stunning Nothing Phone mockup images. Upload your screenshot, choose your device, customise the background and watermark, then export.">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        media="print" onload="this.media='all'"><noscript>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </noscript>
    <link
        href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bangers&family=Bebas+Neue&family=Codystar&family=Courgette&family=Creepster&family=Dancing+Script:wght@400;700&family=Eater&family=Great+Vibes&family=Kaushan+Script&family=Lobster&family=Luckiest+Guy&family=Marck+Script&family=Pacifico&family=Parisienne&family=Playball&family=Quintessential&family=Righteous&family=Rouge+Script&family=Rye&family=Satisfy&family=Stalemate&display=swap"
        rel="stylesheet">


    <style>
        :root {
            --bg: #000;
            --card: #0c0c0c;
            --text: #fff;
            --dot-bg: #222;
            --border: #1a1a1a;
            --instr: #bbb;
            --accent: #ff0000;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            color-scheme: light dark;
        }

        [data-theme="light"] {
            --bg: #fff;
            --card: #f5f5f5;
            --text: #000;
            --dot-bg: #ddd;
            --border: #eee;
            --instr: #333;
        }

        [data-theme="dark"] {
            --bg: #000;
            --card: #0c0c0c;
            --text: #fff;
            --dot-bg: #333;
            --border: #1a1a1a;
            --instr: #bbb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'VT323', monospace;
            transition: background var(--transition);
            width: 100%;
            overflow-x: hidden;
            min-height: 100vh;
            overscroll-behavior-y: none;
        }

        body {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none
        }

        input,
        textarea {
            -webkit-user-select: auto;
            user-select: auto
        }

        h1,
        h2,
        h3,
        span,
        button,
        select,
        input,
        p,
        textarea {
            font-family: 'VT323', monospace !important;
            text-transform: uppercase;
        }

        img {
            -webkit-touch-callout: none !important;
            user-select: none !important;
            pointer-events: auto !important;
        }

        .bento,
        footer {
            content-visibility: auto;
            contain-intrinsic-size: 1000px;
        }

        .stars-container {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: var(--bg);
            overflow: hidden;
            pointer-events: none;
        }



        .canvas {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(var(--dot-bg) 1.2px, transparent 1.2px);
            background-size: 32px 32px;
            z-index: -1;
            opacity: 0.5;
            pointer-events: none;
        }



        header {
            max-width: 1000px;
            margin: 25px auto 20px;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            z-index: 10;
        }

        .header-top {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo h1 {
            font-size: 3.5rem;
            letter-spacing: -1px;
            line-height: 0.9;
        }

        .logo p {
            opacity: 0.8 !important;
            letter-spacing: 2px;
        }

        .t-toggle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 1px solid var(--border);
            display: grid;
            place-items: center;
            cursor: pointer;
            background: var(--card);
            transition: var(--transition);
        }

        .t-toggle:hover {
            border-color: var(--text);
        }

        #t-icon {
            color: var(--text) !important;
            transition: transform .3s ease;
        }

        .t-toggle:active #t-icon {
            transform: rotate(50deg) scale(1.1);
        }

        .t-toggle i.fa-share-alt {
            transition: transform 0.3s ease;
        }

        .t-toggle:active i.fa-share-alt {
            transform: scale(1.15) rotate(-15deg);
        }

        .t-toggle i.fa-robot {
            transition: transform 0.3s ease;
        }

        .t-toggle:active i.fa-robot {
            transform: scale(1.15) rotate(-15deg);
        }

        .bento {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            overflow: visible;
            position: relative;
            z-index: 10;
        }

        @media (min-width: 650px) {
            .bento {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .tile {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 35px;
            padding: 25px;
            cursor: pointer;
            transition: var(--transition);
            opacity: 1;
            transform: none;
            position: relative;
            overflow: hidden;
        }

        .tile:hover {
            border-color: #333;
            transform: translateY(-2px);
        }

        .tile:active {
            transform: scale(0.95);
        }

        .tile h2 {
            font-size: 2.2rem;
            position: relative;
            z-index: 2;
        }

        .tile p {
            opacity: 0.8 !important;
            font-size: 1rem;
            position: relative;
            z-index: 2;
        }

        .full {
            grid-column: span 2;
        }

        @media (min-width: 650px) {
            .full {
                grid-column: span 1;
            }
        }

        .screen {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            overflow: hidden;
            overscroll-behavior: none;
        }

        .screen.active {
            display: flex !important;
            opacity: 1;
        }

        .modal {
            background: var(--bg);
            border: 1px solid var(--border);
            width: 90%;
            max-width: 500px;
            max-height: 90dvh;
            border-radius: 35px;
            padding: 30px;
            position: relative;
            overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: scale(0.7) translateY(50px);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
            will-change: transform, opacity;
            display: flex;
            flex-direction: column;
        }

        .modal>div {
            flex-shrink: 0 !important;
        }

        .screen.active .modal {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .close-icon {
            position: absolute;
            right: 25px;
            top: 25px;
            font-size: 2.2rem;
            cursor: pointer;
            opacity: 0.5;
            transition: 0.2s;
            z-index: 10;
            background: transparent;
            border: none;
            color: var(--text);
        }

        .close-icon:hover {
            opacity: 1;
            color: var(--text);
        }

        .modal h2 {
            margin-bottom: 15px !important;
            margin-top: 5px !important;
            line-height: 1;
        }

        .input-group {
            position: relative;
            width: 100%;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }

        select,
        input,
        textarea {
            width: 100%;
            padding: 20px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 22px;
            font-size: 1.6rem;
            outline: none;
            appearance: none;
        }

        textarea {
            font-size: 1.2rem;
            resize: none;
        }

        .arrow-wrapper {
            position: absolute;
            right: 25px;
            pointer-events: none;
            color: var(--text);
        }

        .btn {
            position: relative;
            width: 100%;
            padding: 18px;
            border-radius: 22px;
            border: none;
            background: var(--text);
            color: var(--bg);
            font-size: 1.5rem;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .progress-bar {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: rgba(128, 128, 128, 0.5);
            z-index: 1;
        }

        .btn-text {
            position: relative;
            z-index: 2;
        }

        .pg-btn {
            width: 100%;
            padding: 20px 30px;
            border-radius: 22px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 1.2rem;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            margin-bottom: 15px;
            font-weight: thin;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .pg-btn:hover {
            border-color: var(--text);
        }

        .pg-btn:active {
            transform: scale(0.98);
        }

        .dot-arrow {
            width: 20px;
            height: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            transition: transform 0.3s ease;
        }

        .dot-row {
            display: flex;
            gap: 2px;
        }

        .dot {
            width: 2.5px;
            height: 2.5px;
            background: var(--text);
            border-radius: 50%;
        }

        .dot-arrow.active {
            transform: scale(1.1);
        }

        .project-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .p-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .p-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border);
        }

        .p-info h3 {
            margin: 0;
            font-size: 1.4rem;
            line-height: 1;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .p-info span {
            font-size: 0.9rem;
            opacity: 0.6;
        }

        .blue-tick {
            color: #3b82f6;
            font-size: 1rem;
        }

        .p-imgs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 15px 0;
        }

        .p-imgs img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid #333;
            cursor: pointer;
        }

        .p-link-btn {
            display: block;
            width: 100%;
            padding: 12px;
            text-align: center;
            border: 1px solid var(--accent);
            color: var(--text);
            border-radius: 15px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            margin-top: 10px;
        }

        .p-link-btn:hover {
            background: var(--accent);
            color: #fff;
        }

        .pfp-select {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 1px dashed var(--text);
            display: grid;
            place-items: center;
            cursor: pointer;
            margin: 0 auto 20px;
            overflow: hidden;
        }

        #prjUrl {
            text-transform: none !important;
            color: #3b82f6 !important
        }

        #prjUrl::placeholder {
            text-transform: uppercase;
            color: #888 !important
        }

        .setup-grid-container {
            padding-top: 0px;
            padding-bottom: 30px;
        }

        .setup-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 25px;
            margin-bottom: 0px;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.4s ease, filter 0.4s ease;
            transform: scale(0.85);
            opacity: 0.4;
            filter: blur(2px);
            transform-origin: center center;
        }

        .setup-card.in-focus {
            transform: scale(1);
            opacity: 1;
            filter: blur(0px);
            z-index: 10;
        }

        .setup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .phone-showcase {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .phone-frame {
            width: 48%;
            aspect-ratio: 9/19;
            background: #000;
            border-radius: 18px;
            border: 2px solid #333;
            overflow: hidden;
            cursor: pointer;
            transition: 0.2s;
        }

        .phone-frame.active {
            border-color: var(--accent);
            transform: scale(1.02);
        }

        .phone-frame img {
            width: 100%;
            height: 100%;
        }

        .dl-btn {
            width: 100%;
            background: var(--text);
            color: var(--bg);
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            display: none;
            margin-top: 10px;
            cursor: pointer;
        }

        .dl-btn:active {
            transform: scale(0.96);
        }

        .upload-box {
            background: var(--card);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .upload-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .upload-area {
            border: 1px dashed #444;
            border-radius: 12px;
            height: 100px;
            display: grid;
            place-items: center;
            cursor: pointer;
            color: #666;
            background: rgba(255, 255, 255, 0.02);
            overflow: hidden;
        }

        .upload-area:active {
            transform: scale(0.99);
        }

        .upload-area img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .like-btn {
            background: transparent;
            border: 1px solid #333;
            color: var(--text);
            padding: 8px 16px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
        }

        .like-btn:active {
            transform: scale(0.98);
        }

        .like-btn.liked {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .selector-list {
            display: flex;
            flex-direction: column;
            max-height: 60vh;
            overflow-y: auto;
            gap: 8px;
        }

        .selector-item {
            padding: 20px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 22px;
            cursor: pointer;
            font-size: 1.4rem;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .selector-item:hover {
            border-color: var(--text);
        }

        .selector-item:active {
            transform: scale(0.97);
        }

        .custom-select-trigger {
            width: 100%;
            padding: 20px;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 22px;
            font-size: 1.6rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .desktop-ad-only {
            display: block;
            text-align: center;
            width: 100%;
            margin: 5px 0;
            overflow: hidden;
        }

        .mobile-ad-only {
            display: none !important;
        }

        @media (max-width: 650px) {
            .desktop-ad-only {
                display: none !important;
            }

            .mobile-ad-only {
                display: flex !important;
                justify-content: center;
                width: 100%;
                margin: 5px 0;
                overflow: hidden;
            }
        }

        ins.adsbygoogle[data-ad-status="unfilled"] {
            display: none !important;
        }

        .red-dot-loader {
            width: 10px;
            height: 10px;
            background-color: #ff0000;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #ff0000;
            animation: pulse-red 0.8s ease-in-out infinite;
        }

        @keyframes pulse-red {
            0% {
                transform: scale(0.8);
                opacity: 0.6;
            }

            50% {
                transform: scale(1.2);
                opacity: 1;
            }

            100% {
                transform: scale(0.8);
                opacity: 0.6;
            }
        }

        .msg-bubble {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 12px 15px;
            border-radius: 20px;
            position: relative;
            max-width: 85%;
            align-self: flex-start;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: background 0.2s;
        }

        .msg-bubble:active {
            background: rgba(255, 255, 255, 0.08);
        }

        .msg-bubble.self {
            align-self: flex-end;
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--text);
            text-align: right;
        }

        .msg-bubble.self .u-badge {
            align-self: flex-end;
        }

        .u-badge {
            font-size: 0.7rem;
            background: var(--text);
            color: var(--bg);
            padding: 2px 8px;
            border-radius: 5px;
            margin-bottom: 5px;
            display: inline-block;
            align-self: flex-start;
            cursor: pointer;
        }

        .u-badge:active {
            transform: scale(0.95);
        }

        .admin-reply-box {
            margin-top: 10px;
            padding: 8px 12px;
            background: rgba(255, 0, 0, 0.05);
            border-left: 2px solid var(--accent);
            border-radius: 10px;
            font-size: 0.9rem;
        }

        .admin-tag {
            color: var(--accent);
            font-weight: bold;
            font-size: 0.7rem;
            display: block;
            margin-bottom: 2px;
        }

        .msg-img {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 5px;
            margin-bottom: 5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
        }

        #imgPreview {
            display: none;
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 8px;
            margin-right: 10px;
            border: 1px solid var(--accent);
            cursor: pointer;
        }

        #replyBanner {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 10px 15px;
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            font-size: 0.9rem;
            animation: slideUp 0.2s ease;
            color: var(--text);
            max-width: 100%;
        }

        .reply-info {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            min-width: 0;
        }

        #replyText {
            opacity: 0.7;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            width: 100%;
        }

        .close-reply-btn {
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            font-size: 1.5rem;
            flex-shrink: 0;
            padding: 0 5px;
        }

        @keyframes slideUp {
            from {
                transform: translateY(10px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .quoted-block {
            background: rgba(127, 127, 127, 0.15);
            border-left: 3px solid var(--text);
            padding: 6px 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            text-align: left;
        }

        .q-name {
            font-weight: bold;
            font-size: 0.75rem;
            opacity: 0.9;
            margin-bottom: 2px;
        }

        .q-text {
            opacity: 0.7;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .msg-footer {
            display: none;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
            margin-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 5px;
            animation: fadeIn 0.2s ease;
        }

        .msg-bubble.active-actions .msg-footer {
            display: flex;
        }

        .action-btn {
            font-size: 0.8rem;
            opacity: 0.6;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 2px 5px;
        }

        .action-btn:hover {
            opacity: 1;
            color: var(--accent);
        }

        .del-btn:hover {
            color: #ff4444;
        }

        #imgViewer {
            position: fixed;
            inset: 0;
            z-index: 5000;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #imgViewer.active {
            opacity: 1;
        }

        #viewImg {
